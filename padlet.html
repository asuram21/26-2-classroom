<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강의 공유 및 소통 학습 보드 (Padlet Style)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* 스크롤바 커스텀 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col antialiased overflow-hidden">

  <!-- 네비게이션 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm flex-shrink-0">
    <div class="w-full px-6 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-2xl">🎓</span>
          <h1 class="text-xl font-bold tracking-tight text-slate-900">스마트 강의 학습 보드</h1>
          <span class="text-[10px] font-medium px-2 py-0.5 bg-blue-50 text-blue-700 rounded-full border border-blue-100">Padlet Style</span>
        </div>
        <p class="text-xs text-slate-500 mt-1">강의 핵심 요약, 중요 키워드, 구글 드라이브 자료를 자유롭게 나누고 소통하세요.</p>
      </div>

      <!-- 상단 유틸리티 메뉴 -->
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="openColModal()" class="inline-flex items-center gap-1 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 rounded-lg px-3 py-1.5 text-xs font-semibold shadow-sm transition-colors">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
          컬럼 추가
        </button>
        <button onclick="handleReset()" class="inline-flex items-center gap-1 bg-white hover:bg-slate-50 text-slate-500 hover:text-slate-800 border border-slate-200 rounded-lg px-3 py-1.5 text-xs font-semibold shadow-sm transition-colors" title="기본 제공 데이터셋으로 전체 초기화합니다.">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          기본값 복원
        </button>
        
        <!-- 백업 내보내기/가져오기 -->
        <div class="relative inline-block text-left" id="backup-dropdown">
          <button onclick="toggleDropdown('backup-menu')" class="inline-flex items-center gap-1 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 rounded-lg px-3 py-1.5 text-xs font-semibold shadow-sm transition-colors">
            <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
            보드 백업
            <i data-lucide="chevron-down" class="w-3 h-3 ml-0.5"></i>
          </button>
          <div id="backup-menu" class="hidden absolute right-0 mt-1.5 w-40 bg-white border border-slate-200 rounded-lg shadow-lg py-1 z-50 text-xs">
            <a href="#" onclick="exportBackup(event)" class="flex items-center px-3 py-2 text-slate-700 hover:bg-slate-50">
              <i data-lucide="download" class="w-3.5 h-3.5 mr-2 text-slate-400"></i> JSON 백업 다운로드
            </a>
            <a href="#" onclick="triggerImport(event)" class="flex items-center px-3 py-2 text-slate-700 hover:bg-slate-50">
              <i data-lucide="upload" class="w-3.5 h-3.5 mr-2 text-slate-400"></i> 백업 파일 불러오기
            </a>
          </div>
        </div>
        <input type="file" id="import-file" accept=".json" onchange="importBackup(event)" class="hidden">
      </div>
    </div>
  </header>

  <!-- 검색 및 필터 패널 -->
  <section class="w-full px-6 mt-4 flex-shrink-0">
    <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
      
      <!-- 실시간 검색창 -->
      <div class="relative flex-1 max-w-sm">
        <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
        <input 
          type="text" 
          id="search-input" 
          placeholder="제목, 본문 내용, 작성자 검색..." 
          oninput="handleSearch()"
          class="w-full pl-9 pr-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all"
        >
      </div>

      <!-- 태그 필터 목록 -->
      <div class="flex flex-wrap items-center gap-1.5 text-xs text-slate-500">
        <span class="flex items-center gap-1 font-semibold mr-1">
          <i data-lucide="tag" class="w-3.5 h-3.5"></i> 태그 필터:
        </span>
        <div id="tag-filters" class="flex flex-wrap gap-1">
          <!-- JS로 바인딩 -->
        </div>
      </div>
    </div>
  </section>

  <!-- 메인 보드 캔버스 영역 -->
  <main class="flex-1 overflow-x-auto p-6 w-full overflow-y-hidden">
    <div id="board-canvas" class="flex space-x-6 h-full items-start">
      <!-- 컬럼과 카드들이 렌더링될 영역 -->
    </div>
  </main>

  <!-- 카드 등록/수정 모달 -->
  <div id="card-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden border border-slate-200">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
        <h3 id="modal-title" class="font-bold text-sm text-slate-800">✨ 새 카드 공유하기</h3>
        <button onclick="closeCardModal()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <form onsubmit="saveCard(event)" class="p-5 space-y-3.5 text-xs">
        <input type="hidden" id="form-card-id">
        <input type="hidden" id="form-column-id">

        <div class="space-y-1">
          <label class="font-bold text-slate-600">제목 <span class="text-red-500">*</span></label>
          <input type="text" id="form-title" placeholder="예: 3강 복습 요약본" required class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="space-y-1">
          <label class="font-bold text-slate-600">작성자 이름 <span class="text-red-500">*</span></label>
          <input type="text" id="form-author" placeholder="예: 홍길동(수강생) 또는 강사" required class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="space-y-1">
          <label class="font-bold text-slate-600">컬럼 분류</label>
          <select id="form-col-select" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <!-- 옵션 동적 추가 -->
          </select>
        </div>

        <div class="space-y-1">
          <label class="font-bold text-slate-600">카드 본문 내용</label>
          <textarea id="form-content" rows="3" placeholder="공유할 중요 내용을 입력하세요." class="w-full p-2.5 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none resize-none"></textarea>
        </div>

        <div class="space-y-1">
          <label class="font-bold text-slate-600 flex justify-between">
            <span>참고 URL / 구글 드라이브 링크</span>
            <span class="text-[9px] text-green-600 font-normal">구글 드라이브 입력 시 전용 배지로 생성</span>
          </label>
          <input type="url" id="form-link" placeholder="예: https://drive.google.com/..." class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="space-y-1">
          <label class="font-bold text-slate-600">태그 (쉼표로 구분)</label>
          <input type="text" id="form-tags" placeholder="예: 3강, 요약, 실습" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="space-y-1">
          <label class="font-bold text-slate-600">카드 테마 색상</label>
          <div class="flex gap-2.5 pt-1" id="color-palette">
            <!-- 동적 컬러 칩 생성 -->
          </div>
          <input type="hidden" id="form-color" value="neutral">
        </div>

        <div class="pt-4 border-t border-slate-100 flex justify-end gap-2">
          <button type="button" onclick="closeCardModal()" class="px-3 py-2 bg-slate-100 hover:bg-slate-250 text-slate-600 font-semibold rounded-lg">취소</button>
          <button type="submit" class="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 컬럼 추가/수정 모달 -->
  <div id="col-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden border border-slate-200">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
        <h3 id="col-modal-title" class="font-bold text-sm text-slate-800">📂 새 컬럼 만들기</h3>
        <button onclick="closeColModal()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <form onsubmit="saveColumn(event)" class="p-5 space-y-4 text-xs">
        <input type="hidden" id="form-col-id">
        <div class="space-y-1">
          <label class="font-bold text-slate-600">컬럼 이름 <span class="text-red-500">*</span></label>
          <input type="text" id="form-col-title" placeholder="예: 📢 공지사항" required class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="closeColModal()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-lg">취소</button>
          <button type="submit" class="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg">완료</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 미니 토스트 메시지 -->
  <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-lg shadow-lg transform translate-y-10 opacity-0 transition-all duration-300 z-50 flex items-center gap-2">
    <span id="toast-icon">✨</span>
    <span id="toast-msg">메시지</span>
  </div>

      }

    const colorPresets = [
      { id: 'neutral', name: '화이트', bg: 'bg-white border-slate-200 text-slate-800' },
      { id: 'rose', name: '핑크', bg: 'bg-rose-50/90 border-rose-200 text-rose-950' },
      { id: 'sky', name: '블루', bg: 'bg-sky-50/90 border-sky-200 text-sky-950' },
      { id: 'amber', name: '옐로우', bg: 'bg-amber-50/90 border-amber-200 text-amber-950' },
      { id: 'emerald', name: '그린', bg: 'bg-emerald-50/90 border-emerald-200 text-emerald-950' },
      { id: 'violet', name: '퍼플', bg: 'bg-violet-50/90 border-violet-200 text-violet-950' }
    ];

    // 어플리케이션 상태 객체
    let state = {
      columns: [],
      cards: [],
      searchQuery: '',
      selectedTag: null
    };

    // 토스트 띄우기 함수
    function showToast(msg, icon = '✨') {
      const toast = document.getElementById('toast');
      document.getElementById('toast-icon').innerText = icon;
      document.getElementById('toast-msg').innerText = msg;
      
      toast.classList.remove('translate-y-10', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-10', 'opacity-0');
      }, 2500);
    }

    // 데이터 영속성 세팅
    function loadData() {
      const cols = localStorage.getItem('stand_padlet_cols');
      const crds = localStorage.getItem('stand_padlet_cards');
      if (cols && crds) {
        state.columns = JSON.parse(cols);
        state.cards = JSON.parse(crds);
      } else {
        state.columns = [...defaultColumns];
        state.cards = [...defaultCards];
        saveData();
      }
    }

    function saveData() {
      localStorage.setItem('stand_padlet_cols', JSON.stringify(state.columns));
      localStorage.setItem('stand_padlet_cards', JSON.stringify(state.cards));
    }

    // 드롭다운 토글
    function toggleDropdown(id) {
      const menu = document.getElementById(id);
      menu.classList.toggle('hidden');
    }

    // 다른 곳 클릭 시 드롭다운 닫기
    window.addEventListener('click', function(e) {
      const dropdown = document.getElementById('backup-dropdown');
      if (dropdown && !dropdown.contains(e.target)) {
        document.getElementById('backup-menu').classList.add('hidden');
      }
    });

    // 기본값 복원 리셋
    function handleReset() {
      if (confirm('보드를 처음 설치된 샘플 데이터셋으로 복원하시겠습니까? 작성 중이던 모든 카드가 삭제됩니다.')) {
        state.columns = [...defaultColumns];
        state.cards = [...defaultCards];
        state.searchQuery = '';
        state.selectedTag = null;
        document.getElementById('search-input').value = '';
        saveData();
        render();
        showToast('보드를 성공적으로 초기화했습니다.', '🔄');
      }
    }

    // 검색어 입력 이벤트 처리
    function handleSearch() {
      state.searchQuery = document.getElementById('search-input').value;
      render();
    }

    // 태그 필터링 처리
    function selectTag(tag) {
      state.selectedTag = tag;
      render();
    }

    // HTML5 드래그앤드롭 이벤트 핸들러
    function dragStart(e, cardId) {
      e.dataTransfer.setData('text/plain', cardId);
      e.dataTransfer.effectAllowed = 'move';
    }

    function dragOver(e) {
      e.preventDefault();
    }

    function dropCard(e, destColId) {
      e.preventDefault();
      const cardId = e.dataTransfer.getData('text/plain');
      if (!cardId) return;

      const card = state.cards.find(c => c.id === cardId);
      if (!card || card.columnId === destColId) return;

      card.columnId = destColId;
      saveData();
      render();
      showToast('카드가 성공적으로 이동되었습니다.', '🚚');
    }

    // 좋아요 토글
    function toggleLike(cardId) {
      const card = state.cards.find(c => c.id === cardId);
      if (!card) return;

      card.liked = !card.liked;
      card.likes = card.liked ? card.likes + 1 : Math.max(0, card.likes - 1);
      saveData();
      render();
      showToast(card.liked ? '이 카드를 추천했습니다!' : '추천을 취소했습니다.', '❤️');
    }

    // 댓글 등록
    function submitComment(e, cardId) {
      e.preventDefault();
      const input = document.getElementById(`comm-input-${cardId}`);
      if (!input || !input.value.trim()) return;

      const userName = localStorage.getItem('stand_padlet_user') || '학습자';
      const newComment = {
        id: 'comm-' + Date.now(),
        author: userName,
        text: input.value.trim(),
        createdAt: new Date().toISOString()
      };

      const card = state.cards.find(c => c.id === cardId);
      if (card) {
        card.comments.push(newComment);
        saveData();
        render();
        showToast('댓글이 등록되었습니다.', '💬');
      }
    }

    // 카드 CRUD 모달 제어
    function openCardModal(colId = '', cardId = '') {
      const modal = document.getElementById('card-modal');
      const select = document.getElementById('form-col-select');
      
      // select 옵션 채우기
      select.innerHTML = state.columns.map(c => `<option value="${c.id}">${c.title}</option>`).join('');

      // 컬러칩 렌더링
      const colorPalette = document.getElementById('color-palette');
      colorPalette.innerHTML = colorPresets.map(preset => {
        const isNeutral = preset.id === 'neutral';
        const colorClass = preset.id === 'rose' ? 'bg-rose-100' :
                           preset.id === 'sky' ? 'bg-sky-100' :
                           preset.id === 'amber' ? 'bg-amber-100' :
                           preset.id === 'emerald' ? 'bg-emerald-100' :
                           preset.id === 'violet' ? 'bg-violet-100' : 'bg-white';
        return `
          <button type="button" onclick="selectColor('${preset.id}')" id="color-chip-${preset.id}" class="h-6 w-6 rounded-full border border-slate-300 ${colorClass} transition-transform focus:outline-none"></button>
        `;
      }).join('');

      if (cardId) {
        // 수정 모드
        const card = state.cards.find(c => c.id === cardId);
        if (!card) return;

        document.getElementById('modal-title').innerText = '✏️ 카드 수정하기';
        document.getElementById('form-card-id').value = card.id;
        document.getElementById('form-column-id').value = card.columnId;
        document.getElementById('form-title').value = card.title;
        document.getElementById('form-author').value = card.author;
        document.getElementById('form-content').value = card.content;
        document.getElementById('form-link').value = card.link || '';
        document.getElementById('form-tags').value = card.tags.join(', ');
        select.value = card.columnId;
        selectColor(card.color);
      } else {
        // 등록 모드
        document.getElementById('modal-title').innerText = '✨ 새 카드 공유하기';
        document.getElementById('form-card-id').value = '';
        document.getElementById('form-column-id').value = colId;
        document.getElementById('form-title').value = '';
        document.getElementById('form-author').value = localStorage.getItem('stand_padlet_user') || '수강생';
        document.getElementById('form-content').value = '';
        document.getElementById('form-link').value = '';
        document.getElementById('form-tags').value = '';
        select.value = colId;
        selectColor('neutral');
      }

      modal.classList.remove('hidden');
    }

    function selectColor(colorId) {
      document.getElementById('form-color').value = colorId;
      // 기존 테두리 초기화 후 선택 칩에 링 추가
      colorPresets.forEach(preset => {
        const chip = document.getElementById(`color-chip-${preset.id}`);
        if (chip) {
          if (preset.id === colorId) {
            chip.classList.add('scale-110', 'ring-2', 'ring-blue-500');
          } else {
            chip.classList.remove('scale-110', 'ring-2', 'ring-blue-500');
          }
        }
      });
    }

    function closeCardModal() {
      document.getElementById('card-modal').classList.add('hidden');
    }

    function saveCard(e) {
      e.preventDefault();
      const cardId = document.getElementById('form-card-id').value;
      const colId = document.getElementById('form-col-select').value;
      const title = document.getElementById('form-title').value.trim();
      const author = document.getElementById('form-author').value.trim();
      const content = document.getElementById('form-content').value.trim();
      const link = document.getElementById('form-link').value.trim();
      const tagsStr = document.getElementById('form-tags').value;
      const color = document.getElementById('form-color').value;

      if (!title) return;

      const tagsArray = tagsStr
        .split(',')
        .map(t => t.trim())
        .filter(t => t.length > 0);

      localStorage.setItem('stand_padlet_user', author);

      if (cardId) {
        // 수정 진행
        const card = state.cards.find(c => c.id === cardId);
        if (card) {
          card.columnId = colId;
          card.title = title;
          card.author = author;
          card.content = content;
          card.link = link || undefined;
          card.tags = tagsArray;
          card.color = color;
        }
        showToast('카드를 수정 완료했습니다.', '📝');
      } else {
        // 신규 추가
        const newCard = {
          id: 'card-' + Date.now(),
          columnId: colId,
          title: title,
          author: author,
          content: content,
          link: link || undefined,
          tags: tagsArray,
          color: color,
          likes: 0,
          liked: false,
          comments: [],
          createdAt: new Date().toISOString()
        };
        state.cards.unshift(newCard);
        showToast('새 카드를 게시했습니다.', '✨');
      }

      saveData();
      closeCardModal();
      render();
    }

    function deleteCard(cardId) {
      if (confirm('이 카드를 삭제하시겠습니까?')) {
        state.cards = state.cards.filter(c => c.id !== cardId);
        saveData();
        render();
        showToast('카드가 삭제되었습니다.', '🗑️');
      }
    }

    // 컬럼 추가/수정 모달 제어
    function openColModal(colId = '') {
      const modal = document.getElementById('col-modal');
      if (colId) {
        const col = state.columns.find(c => c.id === colId);
        if (!col) return;
        document.getElementById('col-modal-title').innerText = '✏️ 컬럼 이름 변경';
        document.getElementById('form-col-id').value = col.id;
        document.getElementById('form-col-title').value = col.title;
      } else {
        document.getElementById('col-modal-title').innerText = '📂 새 컬럼 만들기';
        document.getElementById('form-col-id').value = '';
        document.getElementById('form-col-title').value = '';
      }
      modal.classList.remove('hidden');
    }

    function closeColModal() {
      document.getElementById('col-modal').classList.add('hidden');
    }

    function saveColumn(e) {
      e.preventDefault();
      const colId = document.getElementById('form-col-id').value;
      const title = document.getElementById('form-col-title').value.trim();

      if (!title) return;

      if (colId) {
        const col = state.columns.find(c => c.id === colId);
        if (col) col.title = title;
        showToast('컬럼명을 변경했습니다.', '✏️');
      } else {
        const newCol = {
          id: 'col-' + Date.now(),
          title: title
        };
        state.columns.push(newCol);
        showToast('새 컬럼을 추가했습니다.', '📂');
      }

      saveData();
      closeColModal();
      render();
    }

    function deleteColumn(colId) {
      const cardsInCol = state.cards.filter(c => c.columnId === colId);
      if (cardsInCol.length > 0) {
        if (!confirm(`이 컬럼에 ${cardsInCol.length}개의 카드가 들어있습니다. 컬럼과 카드를 모두 일괄 삭제하시겠습니까?`)) {
          return;
        }
      } else {
        if (!confirm('컬럼을 정말 삭제하시겠습니까?')) return;
      }

      state.columns = state.columns.filter(c => c.id !== colId);
      state.cards = state.cards.filter(c => c.columnId !== colId);
      saveData();
      render();
      showToast('컬럼과 내부 카드가 모두 삭제되었습니다.', '🗑️');
    }

    // JSON 백업 유틸리티
    function exportBackup(e) {
      e.preventDefault();
      const dataStr = JSON.stringify({ columns: state.columns, cards: state.cards }, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `padlet-backup-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      document.getElementById('backup-menu').classList.add('hidden');
      showToast('보드 데이터를 JSON 파일로 저장했습니다.', '💾');
    }

    function triggerImport(e) {
      e.preventDefault();
      document.getElementById('import-file').click();
      document.getElementById('backup-menu').classList.add('hidden');
    }

    function importBackup(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const parsed = JSON.parse(event.target.result);
          if (Array.isArray(parsed.columns) && Array.isArray(parsed.cards)) {
            state.columns = parsed.columns;
            state.cards = parsed.cards;
            saveData();
            render();
            showToast('성공적으로 백업 데이터를 불러왔습니다.', '📂');
          } else {
            alert('올바르지 않은 JSON 포맷입니다.');
          }
        } catch(err) {
          alert('JSON 파일 해석에 실패했습니다.');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    // 구글 드라이브 판단
    function isGoogleDrive(url) {
      if (!url) return false;
      return url.includes('drive.google.com') || url.includes('docs.google.com/document') || url.includes('docs.google.com/spreadsheets');
    }

    // 카드 테마 스타일
    function getCardBgClass(color) {
      const preset = colorPresets.find(p => p.id === color);
      return preset ? preset.bg : colorPresets[0].bg;
    }

    // 화면 렌더링 함수
    function render() {
      const canvas = document.getElementById('board-canvas');
      canvas.innerHTML = '';

      // 1. 태그 필터 바 갱신
      const tags = Array.from(new Set(state.cards.flatMap(c => c.tags))).filter(t => t && t.trim() !== '');
      const filterContainer = document.getElementById('tag-filters');
      
      let filterHtml = `
        <button onclick="selectTag(null)" class="px-2 py-0.5 rounded-full text-[10px] font-semibold border ${!state.selectedTag ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'} transition-all">전체보기</button>
      `;
      tags.forEach(tag => {
        const active = state.selectedTag === tag;
        filterHtml += `
          <button onclick="selectTag('${tag}')" class="px-2 py-0.5 rounded-full text-[10px] font-semibold border ${active ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'} transition-all">#${tag}</button>
        `;
      });
      filterContainer.innerHTML = filterHtml;

      // 2. 컬럼 및 카드 렌더링
      state.columns.forEach(col => {
        // 필터링 적용
        const colCards = state.cards.filter(c => {
          if (c.columnId !== col.id) return false;
          
          const matchSearch = state.searchQuery === '' 
            || c.title.toLowerCase().includes(state.searchQuery.toLowerCase())
            || c.content.toLowerCase().includes(state.searchQuery.toLowerCase())
            || c.author.toLowerCase().includes(state.searchQuery.toLowerCase());
          
          const matchTag = !state.selectedTag || c.tags.includes(state.selectedTag);

          return matchSearch && matchTag;
        });

        // 카드 렌더링용 HTML 작성
        let cardsHtml = '';
        if (colCards.length === 0) {
          cardsHtml = `
            <div class="text-center py-10 px-4 border border-dashed border-slate-200 rounded-xl text-slate-400 text-[11px] leading-relaxed">
              카드가 없습니다.<br>위 버튼을 누르거나 카드를 드래그해 놓으세요.
            </div>
          `;
        } else {
          colCards.forEach(card => {
            const isDrive = isGoogleDrive(card.link);
            
            // 태그 배지 작성
            let tagsBadgeHtml = '';
            if (card.tags && card.tags.length > 0) {
              tagsBadgeHtml = `
                <div class="flex flex-wrap gap-1 mb-2.5">
                  ${card.tags.map(t => `<span onclick="event.stopPropagation(); selectTag('${t}')" class="text-[9px] px-1.5 py-0.5 rounded bg-white/70 border border-black/5 text-slate-500 hover:bg-blue-50 hover:text-blue-600 cursor-pointer transition-colors">#${t}</span>`).join('')}
                </div>
              `;
            }

            // 링크 배지 작성
            let linkBadgeHtml = '';
            if (card.link) {
              if (isDrive) {
                linkBadgeHtml = `
                  <a href="${card.link}" target="_blank" class="flex items-center justify-between p-2 rounded-lg bg-green-50 border border-green-200/50 hover:bg-green-100 transition-all text-[10px] mb-2.5">
                    <div class="flex items-center space-x-1.5 overflow-hidden mr-2">
                      <div class="bg-green-600 text-white p-0.5 rounded flex-shrink-0">
                        <svg class="h-3 w-3 fill-current" viewBox="0 0 24 24">
                          <path d="M19.43 12.981L14.793 5h-5.586l4.637 7.981h5.586zm-13.644.962l-2.786-4.811L7.712 1.19l2.787 4.811-4.713 7.942zm4.07 4.868L12.642 14h5.57l-2.786 4.811H9.856z" />
                        </svg>
                      </div>
                      <span class="font-bold text-green-700 truncate">구글 드라이브 자료 열기</span>
                    </div>
                    <i data-lucide="external-link" class="w-2.5 h-2.5 text-green-600 flex-shrink-0"></i>
                  </a>
                `;
              } else {
                linkBadgeHtml = `
                  <a href="${card.link}" target="_blank" class="flex items-center justify-between p-2 rounded-lg bg-slate-50 border border-slate-200/60 hover:bg-slate-100 transition-all text-[10px] mb-2.5">
                    <div class="flex items-center space-x-1.5 overflow-hidden mr-2">
                      <div class="bg-slate-400 text-white p-0.5 rounded flex-shrink-0">
                        <i data-lucide="file-text" class="w-3 h-3"></i>
                      </div>
                      <span class="font-medium text-slate-600 truncate">${card.link.replace(/https?:\/\/(www\.)?/, '')}</span>
                    </div>
                    <i data-lucide="external-link" class="w-2.5 h-2.5 text-slate-500 flex-shrink-0"></i>
                  </a>
                `;
              }
            }

            // 댓글 피드백 데이터 생성
            let commentsHtml = '';
            if (card.comments && card.comments.length > 0) {
              commentsHtml = `
                <div class="mt-2.5 pt-2 border-t border-dashed border-slate-200/50 space-y-1.5 bg-slate-50/50 p-2 rounded-lg">
                  ${card.comments.map(c => `
                    <div class="text-[10px] leading-relaxed">
                      <div class="flex justify-between font-bold text-slate-700">
                        <span>${c.author}</span>
                        <span class="text-[8px] font-normal text-slate-400">
                          ${new Date(c.createdAt).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric' })}
                        </span>
                      </div>
                      <p class="text-slate-600 mt-0.5 break-all font-normal">${c.text}</p>
                    </div>
                  `).join('')}
                </div>
              `;
            }

            const likeActiveColor = card.liked ? 'text-red-500 hover:text-red-600' : 'text-slate-400 hover:text-slate-500';
            const likeIconFill = card.liked ? 'fill-current' : '';

            cardsHtml += `
              <div 
                draggable="true" 
                ondragstart="dragStart(event, '${card.id}')"
                class="group/card border rounded-xl shadow-sm p-4 transition-all duration-200 hover:shadow-md cursor-grab active:cursor-grabbing relative ${getCardBgClass(card.color)}"
              >
                <!-- 카드 툴박스 -->
                <div class="absolute top-2.5 right-2.5 opacity-0 group-hover/card:opacity-100 transition-opacity flex space-x-0.5 bg-white/95 p-0.5 rounded-lg border border-slate-200 shadow-sm z-10">
                  <button onclick="openCardModal('', '${card.id}')" class="p-1 hover:bg-slate-100 rounded text-slate-500 hover:text-blue-600" title="수정">
                    <i data-lucide="edit-2" class="w-3 h-3"></i>
                  </button>
                  <button onclick="deleteCard('${card.id}')" class="p-1 hover:bg-slate-100 rounded text-slate-500 hover:text-red-600" title="삭제">
                    <i data-lucide="trash-2" class="w-3 h-3"></i>
                  </button>
                </div>

                <!-- 헤더 메타데이터 -->
                <div class="flex items-center text-[10px] text-slate-400 mb-1.5">
                  <span class="font-bold flex items-center mr-2 text-slate-600">
                    <i data-lucide="user" class="w-2.5 h-2.5 mr-0.5 text-slate-400"></i> ${card.author}
                  </span>
                  <span>•</span>
                  <span class="ml-2 flex items-center">
                    <i data-lucide="calendar" class="w-2.5 h-2.5 mr-0.5 text-slate-400"></i>
                    ${new Date(card.createdAt).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}
                  </span>
                </div>

                <!-- 제목 -->
                <h4 class="font-bold text-xs text-slate-800 leading-snug mb-1.5 pr-8">${card.title}</h4>
                <!-- 본문 -->
                <p class="text-[11px] text-slate-600 whitespace-pre-line leading-relaxed mb-3">${card.content}</p>

                <!-- 첨부 배지 -->
                ${linkBadgeHtml}

                <!-- 태그 목록 -->
                ${tagsBadgeHtml}

                <!-- 반응 피드백 -->
                <div class="flex items-center justify-between border-t border-slate-200/40 pt-2.5 mt-2">
                  <button onclick="toggleLike('${card.id}')" class="flex items-center space-x-1 text-[10px] font-semibold ${likeActiveColor} transition-colors focus:outline-none">
                    <i data-lucide="heart" class="w-3 h-3 ${likeIconFill}"></i>
                    <span>공감 ${card.likes}</span>
                  </button>
                  <div class="flex items-center space-x-1 text-[10px] text-slate-400">
                    <i data-lucide="message-square" class="w-3 h-3"></i>
                    <span>댓글 ${card.comments.length}</span>
                  </div>
                </div>

                <!-- 댓글 목록 -->
                ${commentsHtml}

                <!-- 댓글 작성 인풋 -->
                <form onsubmit="submitComment(event, '${card.id}')" class="mt-2.5 flex items-center space-x-1.5">
                  <input type="text" id="comm-input-${card.id}" placeholder="댓글 쓰기..." class="h-6.5 text-[10px] px-2 py-0.5 flex-1 bg-white/70 border border-slate-200 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
                  <button type="submit" class="h-6.5 px-1.5 text-blue-600 hover:bg-blue-50 rounded text-[10px] font-bold transition-all focus:outline-none">게시</button>
                </form>
              </div>
            `;
          });
        }

        // 컬럼 HTML 조립
        const colHtml = `
          <div 
            class="flex-shrink-0 w-80 bg-slate-100/70 border border-slate-200/80 rounded-2xl p-4 flex flex-col max-h-full h-full shadow-sm relative"
            ondragover="dragOver(event)"
            ondrop="dropCard(event, '${col.id}')"
          >
            <!-- 컬럼 헤더 -->
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center space-x-2">
                <span class="font-bold text-slate-800 text-sm">${col.title}</span>
                <span class="px-1.5 py-0.2 text-[10px] bg-slate-200/50 text-slate-600 font-semibold rounded-md">${colCards.length}</span>
              </div>
              <div class="relative inline-block text-left" id="dropdown-${col.id}">
                <button onclick="toggleDropdown('dropmenu-${col.id}')" class="h-6 w-6 text-slate-400 hover:text-slate-600 rounded-full flex items-center justify-center hover:bg-slate-200/40">
                  <i data-lucide="more-vertical" class="w-3.5 h-3.5"></i>
                </button>
                <div id="dropmenu-${col.id}" class="hidden absolute right-0 mt-1 w-28 bg-white border border-slate-200 rounded-lg shadow-lg py-1 z-50 text-[11px]">
                  <a href="#" onclick="event.preventDefault(); document.getElementById('dropmenu-${col.id}').classList.add('hidden'); openColModal('${col.id}')" class="flex items-center px-3 py-1.5 text-slate-700 hover:bg-slate-50">
                    <i data-lucide="edit-2" class="w-3 h-3 mr-2 text-slate-400"></i> 이름 변경
                  </a>
                  <a href="#" onclick="event.preventDefault(); document.getElementById('dropmenu-${col.id}').classList.add('hidden'); deleteColumn('${col.id}')" class="flex items-center px-3 py-1.5 text-red-600 hover:bg-slate-50">
                    <i data-lucide="trash-2" class="w-3 h-3 mr-2 text-red-400"></i> 컬럼 삭제
                  </a>
                </div>
              </div>
            </div>

            <!-- 새 카드 등록 -->
            <button onclick="openCardModal('${col.id}')" class="w-full bg-white border border-dashed border-slate-200 hover:border-blue-400 hover:text-blue-600 text-slate-500 text-xs mb-3 shadow-sm h-8 rounded-lg flex items-center justify-center gap-1 font-semibold transition-all">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              새 카드 추가
            </button>

            <!-- 카드 리스크 스크롤러 -->
            <div class="space-y-3 overflow-y-auto pr-0.5 flex-1 custom-scrollbar">
              ${cardsHtml}
            </div>
          </div>
        `;
        canvas.innerHTML += colHtml;
      });

      // Lucide 아이콘 초기화 바인딩
      lucide.createIcons();
    }

    // 문서 로드 완료 시 구동
    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      render();
    });
  </script>
</body>
</html>
