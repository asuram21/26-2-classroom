          <button type="button" onclick="selectColor('amber')" id="color-chip-amber" class="h-6 w-6 rounded-full border border-slate-300 bg-amber-100 transition-transform focus:outline-none scale-110 ring-2 ring-blue-500"></button>
        
          <button type="button" onclick="selectColor('emerald')" id="color-chip-emerald" class="h-6 w-6 rounded-full border border-slate-300 bg-emerald-100 transition-transform focus:outline-none"></button>
        
          <button type="button" onclick="selectColor('violet')" id="color-chip-violet" class="h-6 w-6 rounded-full border border-slate-300 bg-violet-100 transition-transform focus:outline-none"></button>

  <!-- 컬럼 추가/수정 모달 (관리자용) -->
  <div id="col-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden border border-slate-200">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">

  <!-- 미니 토스트 메시지 -->
  <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-lg shadow-lg transform transition-all duration-300 z-50 flex items-center gap-2 translate-y-10 opacity-0">
    <span id="toast-icon">📝</span>
    <span id="toast-msg">카드가 수정되었습니다.</span>
  </div>

  <!-- 비즈니스 로직 스크립트 -->
  <script>
    // 관리자(강사) 권한 여부 자동 체크 
    // 로컬 파일 시스템(file:///)으로 실행하거나 로컬 개발 도메인일 경우 관리자 모드 활성화
    const isAdmin = location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';

    const colorPresets = [
      { id: 'neutral', name: '화이트', bg: 'bg-white border-slate-200 text-slate-800' },
      { id: 'rose', name: '핑크', bg: 'bg-rose-50/90 border-rose-200 text-rose-950' },
      { id: 'sky', name: '블루', bg: 'bg-sky-50/90 border-sky-200 text-sky-950' },
      { id: 'amber', name: '옐로우', bg: 'bg-amber-50/90 border-amber-200 text-amber-950' },
      { id: 'emerald', name: '그린', bg: 'bg-emerald-50/90 border-emerald-200 text-emerald-950' },
      { id: 'violet', name: '퍼플', bg: 'bg-violet-50/90 border-violet-200 text-violet-950' }
    ];

    // 현재 구동중인 보드 상태값
    let state = {
      columns: [],
      cards: [],
      searchQuery: '',
      selectedTag: null
    };

    // 토스트 띄우기 함수
    function showToast(msg, icon = '✨') {
      const toast = document.getElementById('toast');
      document.getElementById('toast-icon').innerText = icon;
      document.getElementById('toast-msg').innerText = msg;
      
      toast.classList.remove('translate-y-10', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-10', 'opacity-0');
      }, 3500);
    }

    // 파일 로드 및 초기 데이터 세팅
    function loadData() {
      // 관리자(강사)일 때는 로컬스토리지 임시 상태도 읽어와 작업을 부드럽게 이어나가도록 처리
      if (isAdmin) {
        const savedCols = localStorage.getItem('stand_padlet_cols');
        const savedCards = localStorage.getItem('stand_padlet_cards');
        if (savedCols && savedCards) {
          state.columns = JSON.parse(savedCols);
          state.cards = JSON.parse(savedCards);
          return;
        }
      }
      
      // 일반 학생이거나 로컬 백업이 없는 경우 script[id="board-data"]의 값을 읽어옵니다.
      state.columns = [...defaultColumns];
      state.cards = [...defaultCards];
    }

    function saveData() {
      if (isAdmin) {
        localStorage.setItem('stand_padlet_cols', JSON.stringify(state.columns));
        localStorage.setItem('stand_padlet_cards', JSON.stringify(state.cards));
      }
    }

    // 기본값 복원 리셋
    function handleReset() {
      if (confirm('보드를 처음 내장된 템플릿 데이터셋으로 되돌리시겠습니까? 작업 중인 수정한 내역은 삭제됩니다.')) {
        state.columns = [...defaultColumns];
        state.cards = [...defaultCards];
        state.searchQuery = '';
        state.selectedTag = null;
        document.getElementById('search-input').value = '';
        saveData();
        render();
        showToast('보드를 기본 제공 데이터셋으로 되돌렸습니다.', '🔄');
      }
    }

    // 검색어 처리
    function handleSearch() {
      state.searchQuery = document.getElementById('search-input').value;
      render();
    }

    // 태그 필터 처리
    function selectTag(tag) {
      state.selectedTag = tag;
      render();
    }

    // HTML5 드래그앤드롭 이벤트 핸들러
    function dragStart(e, cardId) {
      if (!isAdmin) return;
      e.dataTransfer.setData('text/plain', cardId);
      e.dataTransfer.effectAllowed = 'move';
    }

    function dragOver(e) {
      if (!isAdmin) return;
      e.preventDefault();
    }

    function dropCard(e, destColId) {
      if (!isAdmin) return;
      e.preventDefault();
      const cardId = e.dataTransfer.getData('text/plain');
      if (!cardId) return;

      const card = state.cards.find(c => c.id === cardId);
      if (!card || card.columnId === destColId) return;

      card.columnId = destColId;
      saveData();
      render();
      showToast('카드가 이동되었습니다.', '🚚');
    }

    // 카드 CRUD 모달 제어
    function openCardModal(colId = '', cardId = '') {
      if (!isAdmin) return;
      const modal = document.getElementById('card-modal');
      const select = document.getElementById('form-col-select');
      
      select.innerHTML = state.columns.map(c => `<option value="${c.id}">${c.title}</option>`).join('');

      // 컬러칩 렌더링
      const colorPalette = document.getElementById('color-palette');
      colorPalette.innerHTML = colorPresets.map(preset => {
        const colorClass = preset.id === 'rose' ? 'bg-rose-100' :
                           preset.id === 'sky' ? 'bg-sky-100' :
                           preset.id === 'amber' ? 'bg-amber-100' :
                           preset.id === 'emerald' ? 'bg-emerald-100' :
                           preset.id === 'violet' ? 'bg-violet-100' : 'bg-white';
        return `
          <button type="button" onclick="selectColor('${preset.id}')" id="color-chip-${preset.id}" class="h-6 w-6 rounded-full border border-slate-300 ${colorClass} transition-transform focus:outline-none"></button>
        `;
      }).join('');

      if (cardId) {
        // 수정 모드
        const card = state.cards.find(c => c.id === cardId);
        if (!card) return;

        document.getElementById('modal-title').innerText = '✏️ 카드 내용 편집';
        document.getElementById('form-card-id').value = card.id;
        document.getElementById('form-column-id').value = card.columnId;
        document.getElementById('form-title').value = card.title;
        document.getElementById('form-author').value = card.author || '강사';
        document.getElementById('form-content').value = card.content;
        document.getElementById('form-link').value = card.link || '';
        document.getElementById('form-tags').value = card.tags.join(', ');
        select.value = card.columnId;
        selectColor(card.color);
      } else {
        // 등록 모드
        document.getElementById('modal-title').innerText = '✨ 새 카드 등록하기';
        document.getElementById('form-card-id').value = '';
        document.getElementById('form-column-id').value = colId;
        document.getElementById('form-title').value = '';
        document.getElementById('form-author').value = '강사';
        document.getElementById('form-content').value = '';
        document.getElementById('form-link').value = '';
        document.getElementById('form-tags').value = '';
        select.value = colId;
        selectColor('neutral');
      }

      modal.classList.remove('hidden');
    }

    function selectColor(colorId) {
      document.getElementById('form-color').value = colorId;
      colorPresets.forEach(preset => {
        const chip = document.getElementById(`color-chip-${preset.id}`);
        if (chip) {
          if (preset.id === colorId) {
            chip.classList.add('scale-110', 'ring-2', 'ring-blue-500');
          } else {
            chip.classList.remove('scale-110', 'ring-2', 'ring-blue-500');
          }
        }
      });
    }

    function closeCardModal() {
      document.getElementById('card-modal').classList.add('hidden');
    }

    function saveCard(e) {
      e.preventDefault();
      if (!isAdmin) return;

      const cardId = document.getElementById('form-card-id').value;
      const colId = document.getElementById('form-col-select').value;
      const title = document.getElementById('form-title').value.trim();
      const author = document.getElementById('form-author').value.trim() || '강사';
      const content = document.getElementById('form-content').value.trim();
      const link = document.getElementById('form-link').value.trim();
      const tagsStr = document.getElementById('form-tags').value;
      const color = document.getElementById('form-color').value;

      if (!title) return;

      const tagsArray = tagsStr
        .split(',')
        .map(t => t.trim())
        .filter(t => t.length > 0);

      if (cardId) {
        // 수정 완료
        const card = state.cards.find(c => c.id === cardId);
        if (card) {
          card.columnId = colId;
          card.title = title;
          card.author = author;
          card.content = content;
          card.link = link || undefined;
          card.tags = tagsArray;
          card.color = color;
        }
        showToast('카드가 수정되었습니다.', '📝');
      } else {
        // 신규 등록
        const newCard = {
          id: 'card-' + Date.now(),
          columnId: colId,
          title: title,
          author: author,
          content: content,
          link: link || undefined,
          tags: tagsArray,
          color: color,
          createdAt: new Date().toISOString()
        };
        state.cards.unshift(newCard);
        showToast('새 카드가 추가되었습니다.', '✨');
      }

      saveData();
      closeCardModal();
      render();
    }

    function deleteCard(cardId) {
      if (!isAdmin) return;
      if (confirm('이 카드를 삭제하시겠습니까?')) {
        state.cards = state.cards.filter(c => c.id !== cardId);
        saveData();
        render();
        showToast('카드가 삭제되었습니다.', '🗑️');
      }
    }

    // 컬럼 추가/수정 모달 제어
    function openColModal(colId = '') {
      if (!isAdmin) return;
      const modal = document.getElementById('col-modal');
      if (colId) {
        const col = state.columns.find(c => c.id === colId);
        if (!col) return;
        document.getElementById('col-modal-title').innerText = '✏️ 컬럼 이름 변경';
        document.getElementById('form-col-id').value = col.id;
        document.getElementById('form-col-title').value = col.title;
      } else {
        document.getElementById('col-modal-title').innerText = '📂 새 컬럼 만들기';
        document.getElementById('form-col-id').value = '';
        document.getElementById('form-col-title').value = '';
      }
      modal.classList.remove('hidden');
    }

    function closeColModal() {
      document.getElementById('col-modal').classList.add('hidden');
    }

    function saveColumn(e) {
      e.preventDefault();
      if (!isAdmin) return;

      const colId = document.getElementById('form-col-id').value;
      const title = document.getElementById('form-col-title').value.trim();

      if (!title) return;

      if (colId) {
        const col = state.columns.find(c => c.id === colId);
        if (col) col.title = title;
        showToast('컬럼명이 수정되었습니다.', '✏️');
      } else {
        const newCol = {
          id: 'col-' + Date.now(),
          title: title
        };
        state.columns.push(newCol);
        showToast('새 컬럼이 생성되었습니다.', '📂');
      }

      saveData();
      closeColModal();
      render();
    }

    function deleteColumn(colId) {
      if (!isAdmin) return;
      const cardsInCol = state.cards.filter(c => c.columnId === colId);
      if (cardsInCol.length > 0) {
        if (!confirm(`이 컬럼에 ${cardsInCol.length}개의 카드정보가 들어있습니다. 컬럼과 내부 카드들을 모두 함께 삭제하시겠습니까?`)) {
          return;
        }
      } else {
        if (!confirm('정말 이 컬럼을 삭제하시겠습니까?')) return;
      }

      state.columns = state.columns.filter(c => c.id !== colId);
      state.cards = state.cards.filter(c => c.columnId !== colId);
      saveData();
      render();
      showToast('컬럼이 삭제되었습니다.', '🗑️');
    }

    // 구글 드라이브 주소 판단 함수
    function isGoogleDrive(url) {
      if (!url) return false;
      return url.includes('drive.google.com') || url.includes('docs.google.com/document') || url.includes('docs.google.com/spreadsheets');
    }

    // 카드 테마 색상 획득
    function getCardBgClass(color) {
      const preset = colorPresets.find(p => p.id === color);
      return preset ? preset.bg : colorPresets[0].bg;
    }

    // ===================================================
    // 💾 핵심: 강사님이 편집한 내용을 소스코드 파일로 직접 저장하기
    // ===================================================
    function saveHTMLSource() {
      if (!isAdmin) return;

      // 1. 저장 시 파일 크기를 줄이기 위해 임시로 동적 렌더링 영역 비우기
      const canvas = document.getElementById('board-canvas');
      const oldCanvasHTML = canvas.innerHTML;
      canvas.innerHTML = '';

      const tagFilters = document.getElementById('tag-filters');
      const oldTagsHTML = tagFilters.innerHTML;
      tagFilters.innerHTML = '';

      // 2. 전체 HTML 소스 코드 문자열 획득
      let html = '<!DOCTYPE html>\n<html lang="ko">\n' + document.documentElement.outerHTML + '\n</html>';

      // 3. 정규식을 통해 script[id="board-data"] 내부의 변수 값을 최신 상태로 치환
      const dataScriptRegex = /<script id="board-data">([\s\S]*?)<\/script>/;
      const newScriptContent = `<script id="board-data">
    const defaultColumns = ${JSON.stringify(state.columns, null, 6)};
    const defaultCards = ${JSON.stringify(state.cards, null, 6)};
  <\/script>`;
      html = html.replace(dataScriptRegex, newScriptContent);

      // 4. 즉시 화면 복구 처리 (사용자는 깜빡임을 느끼지 못함)
      canvas.innerHTML = oldCanvasHTML;
      tagFilters.innerHTML = oldTagsHTML;
      lucide.createIcons();

      // 5. HTML 다운로드 파일 생성 및 가상 링크 작동
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      // 기본 생성되는 이름을 padlet.html 또는 index.html로 유도
      link.download = 'padlet.html'; 
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      showToast('수정된 HTML 소스 코드가 다운로드되었습니다! 로컬 폴더에 덮어쓴 뒤 Git에 Push 하시면 학생들에게 즉시 반영됩니다.', '💾');
    }

    // ===================================================
    // 화면 드로잉 렌더러 함수
    // ===================================================
    function render() {
      const canvas = document.getElementById('board-canvas');
      canvas.innerHTML = '';

      // 1. 태그 목록 수집 및 필터바 그리기
      const tags = Array.from(new Set(state.cards.flatMap(c => c.tags))).filter(t => t && t.trim() !== '');
      const filterContainer = document.getElementById('tag-filters');
      
      let filterHtml = `
        <button onclick="selectTag(null)" class="px-2.5 py-0.5 rounded-full text-[10px] font-semibold border ${!state.selectedTag ? 'bg-slate-800 text-white border-slate-800 shadow-sm' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'} transition-all">전체보기</button>
      `;
      tags.forEach(tag => {
        const active = state.selectedTag === tag;
        filterHtml += `
          <button onclick="selectTag('${tag}')" class="px-2.5 py-0.5 rounded-full text-[10px] font-semibold border ${active ? 'bg-slate-800 text-white border-slate-800 shadow-sm' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'} transition-all">#${tag}</button>
        `;
      });
      filterContainer.innerHTML = filterHtml;

      // 2. 각 컬럼 돌면서 하위 카드들 매칭 그리기
      state.columns.forEach(col => {
        const colCards = state.cards.filter(c => {
          if (c.columnId !== col.id) return false;
          
          const matchSearch = state.searchQuery === '' 
            || c.title.toLowerCase().includes(state.searchQuery.toLowerCase())
            || c.content.toLowerCase().includes(state.searchQuery.toLowerCase());
          
          const matchTag = !state.selectedTag || c.tags.includes(state.selectedTag);

          return matchSearch && matchTag;
        });

        let cardsHtml = '';
        if (colCards.length === 0) {
          cardsHtml = `
            <div class="text-center py-10 px-4 border border-dashed border-slate-200 rounded-xl text-slate-400 text-[11px] leading-relaxed select-none">
              등록된 공지가 없습니다.
            </div>
          `;
        } else {
          colCards.forEach(card => {
            const isDrive = isGoogleDrive(card.link);
            
            // 해시태그 렌더링
            let tagsBadgeHtml = '';
            if (card.tags && card.tags.length > 0) {
              tagsBadgeHtml = `
                <div class="flex flex-wrap gap-1 mb-1.5">
                  ${card.tags.map(t => `<span onclick="event.stopPropagation(); selectTag('${t}')" class="text-[9px] px-1.5 py-0.5 rounded bg-white/70 border border-black/5 text-slate-500 hover:bg-blue-50 hover:text-blue-600 cursor-pointer transition-colors">#${t}</span>`).join('')}
                </div>
              `;
            }

            // 외부 문서 혹은 구글 드라이브 바로가기 배지 렌더링
            let linkBadgeHtml = '';
            if (card.link) {
              if (isDrive) {
                linkBadgeHtml = `
                  <a href="${card.link}" target="_blank" class="flex items-center justify-between p-2 rounded-lg bg-green-50 border border-green-200/50 hover:bg-green-100 transition-all text-[10px] mb-1">
                    <div class="flex items-center space-x-1.5 overflow-hidden mr-2">
                      <div class="bg-green-600 text-white p-0.5 rounded flex-shrink-0">
                        <svg class="h-3.5 w-3.5 fill-current" viewBox="0 0 24 24">
                          <path d="M19.43 12.981L14.793 5h-5.586l4.637 7.981h5.586zm-13.644.962l-2.786-4.811L7.712 1.19l2.787 4.811-4.713 7.942zm4.07 4.868L12.642 14h5.57l-2.786 4.811H9.856z" />
                        </svg>
                      </div>
                      <span class="font-bold text-green-700 truncate">구글 드라이브 자료 링크</span>
                    </div>
                    <i data-lucide="external-link" class="w-3 h-3 text-green-600 flex-shrink-0"></i>
                  </a>
                `;
              } else {
                linkBadgeHtml = `
                  <a href="${card.link}" target="_blank" class="flex items-center justify-between p-2 rounded-lg bg-slate-50 border border-slate-200/60 hover:bg-slate-100 transition-all text-[10px] mb-1">
                    <div class="flex items-center space-x-1.5 overflow-hidden mr-2">
                      <div class="bg-slate-400 text-white p-0.5 rounded flex-shrink-0">
                        <i data-lucide="file-text" class="w-3 h-3"></i>
                      </div>
                      <span class="font-medium text-slate-600 truncate">${card.link.replace(/https?:\/\/(www\.)?/, '')}</span>
                    </div>
                    <i data-lucide="external-link" class="w-3 h-3 text-slate-500 flex-shrink-0"></i>
                  </a>
                `;
              }
            }

            // 관리자 전용 편집 툴박스 마크업
            let adminCardTools = '';
            if (isAdmin) {
              adminCardTools = `
                <div class="absolute top-2.5 right-2.5 opacity-0 group-hover/card:opacity-100 transition-opacity flex space-x-0.5 bg-white/95 p-0.5 rounded-lg border border-slate-200 shadow-sm z-10">
                  <button onclick="openCardModal('', '${card.id}')" class="p-1 hover:bg-slate-100 rounded text-slate-500 hover:text-blue-600" title="수정">
                    <i data-lucide="edit-2" class="w-3 h-3"></i>
                  </button>
                  <button onclick="deleteCard('${card.id}')" class="p-1 hover:bg-slate-100 rounded text-slate-500 hover:text-red-600" title="삭제">
                    <i data-lucide="trash-2" class="w-3 h-3"></i>
                  </button>
                </div>
              `;
            }

            cardsHtml += `
              <div 
                draggable="${isAdmin ? 'true' : 'false'}" 
                ondragstart="dragStart(event, '${card.id}')"
                class="group/card border rounded-xl shadow-sm p-4 transition-all duration-200 hover:shadow-md ${isAdmin ? 'cursor-grab active:cursor-grabbing' : ''} relative ${getCardBgClass(card.color)}"
              >
                ${adminCardTools}

                <!-- 상단 작성일시 정보 -->
                <div class="flex items-center text-[10px] text-slate-400 mb-1.5 select-none">
                  <span class="font-bold flex items-center mr-2 text-slate-600">
                    <i data-lucide="user" class="w-2.5 h-2.5 mr-0.5 text-slate-400"></i> ${card.author || '강사'}
                  </span>
                </div>

                <!-- 타이틀 -->
                <h4 class="font-bold text-xs text-slate-800 leading-snug mb-1.5 pr-8 select-text">${card.title}</h4>
                <!-- 본문 -->
                <p class="text-[11px] text-slate-600 whitespace-pre-line leading-relaxed mb-3 select-text">${card.content}</p>

                <!-- 첨부버튼 & 해시태그 -->
                ${linkBadgeHtml}
                ${tagsBadgeHtml}
              </div>
            `;
          });
        }

        // 관리자 전용 컬럼 수정 메뉴 및 카드추가버튼 활성화
        let adminColMenu = '';
        let adminColBtn = '';
        if (isAdmin) {
          adminColMenu = `
            <div class="relative inline-block text-left" id="dropdown-${col.id}">
              <button onclick="toggleDropdown('dropmenu-${col.id}')" class="h-6 w-6 text-slate-400 hover:text-slate-600 rounded-full flex items-center justify-center hover:bg-slate-200/40">
                <i data-lucide="more-vertical" class="w-3.5 h-3.5"></i>
              </button>
              <div id="dropmenu-${col.id}" class="hidden absolute right-0 mt-1 w-28 bg-white border border-slate-200 rounded-lg shadow-lg py-1 z-50 text-[11px]">
                <a href="#" onclick="event.preventDefault(); document.getElementById('dropmenu-${col.id}').classList.add('hidden'); openColModal('${col.id}')" class="flex items-center px-3 py-1.5 text-slate-700 hover:bg-slate-50">
                  <i data-lucide="edit-2" class="w-3 h-3 mr-2 text-slate-400"></i> 이름 변경
                </a>
                <a href="#" onclick="event.preventDefault(); document.getElementById('dropmenu-${col.id}').classList.add('hidden'); deleteColumn('${col.id}')" class="flex items-center px-3 py-1.5 text-red-600 hover:bg-slate-50">
                  <i data-lucide="trash-2" class="w-3 h-3 mr-2 text-red-400"></i> 컬럼 삭제
                </a>
              </div>
            </div>
          `;
          adminColBtn = `
            <button onclick="openCardModal('${col.id}')" class="w-full bg-white border border-dashed border-slate-200 hover:border-blue-400 hover:text-blue-600 text-slate-500 text-xs mb-3 shadow-sm h-8 rounded-lg flex items-center justify-center gap-1 font-semibold transition-all">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              새 카드 추가
            </button>
          `;
        }

        const colHtml = `
          <div 
            class="flex-shrink-0 w-80 bg-slate-100/70 border border-slate-200/80 rounded-2xl p-4 flex flex-col max-h-full h-full shadow-sm relative"
            ondragover="dragOver(event)"
            ondrop="dropCard(event, '${col.id}')"
          >
            <!-- 컬럼 타이틀 정보 -->
            <div class="flex items-center justify-between mb-3 select-none">
              <div class="flex items-center space-x-2">
                <span class="font-bold text-slate-800 text-sm">${col.title}</span>
                <span class="px-1.5 py-0.2 text-[10px] bg-slate-200/50 text-slate-600 font-semibold rounded-md">${colCards.length}</span>
              </div>
              ${adminColMenu}
            </div>

            <!-- 새 카드 추가 퀵 단추 -->
            ${adminColBtn}

            <!-- 카드 리스트 영역 -->
            <div class="space-y-3 overflow-y-auto pr-0.5 flex-1 custom-scrollbar">
              ${cardsHtml}
            </div>
          </div>
        `;
        canvas.innerHTML += colHtml;
      });

      // 아이콘 드로잉
      lucide.createIcons();
    }

    // 어플리케이션 초기화 구동
    window.addEventListener('DOMContentLoaded', () => {
      // 관리자일 때에만 전용 UI 활성화 및 안내 알림 노출
      if (isAdmin) {
        document.getElementById('admin-actions').classList.remove('hidden');
        const badge = document.getElementById('role-badge');
        badge.innerText = '강사 편집 모드';
        badge.className = 'text-[10px] font-medium px-2 py-0.5 bg-emerald-150 text-emerald-700 rounded-full border border-emerald-200';
        
        setTimeout(() => {
          showToast('로컬 파일 감지: 강사 편집 모드가 켜졌습니다. 수정 후 저장 버튼을 눌러 소스코드를 새로 다운로드 받으세요!', '🛡️');
        }, 1000);
      }

      loadData();
      render();
    });
  </script>
